# Ruff configuration for Odoo Mail Sync for Microsoft 365 (Odoo 18 modules)
# Mirrors the KMT-Odoo rule set: line length 120, security checks enabled.
# Docs: https://docs.astral.sh/ruff/

target-version = "py310"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # assert used (ok in tests)
    "S603",  # subprocess call (ok in scripts)
    "S607",  # partial path (ok in scripts)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]       # Unused imports (re-exports)
"__manifest__.py" = ["B018"]   # Bare dict is standard Odoo manifest format
"tests/**" = ["S101"]          # Allow assert in tests
"scripts/**" = ["S"]           # Relax security checks for scripts

[lint.isort]
known-third-party = ["odoo"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[format]
quote-style = "double"
indent-style = "space"
